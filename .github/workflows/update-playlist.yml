name: Build IPTV Playlist

on:
  schedule:
    # Chạy tự động mỗi 6 tiếng (UTC): 00:00, 06:00, 12:00, 18:00
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: repo-auto-commit-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run tao_playlist.py
        env:
          EPG_URL: ${{ secrets.EPG_URL }}
        run: |
          export EPG_URL="${EPG_URL:-https://lichphatsong.io.vn/epg.xml}"
          python tao_playlist.py

      - name: Commit and push output.m3u if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output.m3u
          if git diff --staged --quiet; then
            echo "Không có thay đổi trong output.m3u"
          else
            git commit -m "Update output.m3u"
            for attempt in 1 2 3; do
              git pull --rebase --autostash origin "${{ github.ref_name }}"
              if git push origin "HEAD:${{ github.ref_name }}"; then
                echo "Push thành công ở lần thử thứ $attempt"
                break
              fi
              echo "Push bị từ chối, thử lại sau 3s..."
              sleep 3
            done
          fi
